apis:
- aid: vocus:wholesale-apis
  name: Vocus Wholesale APIs
  description: Vocus next-gen APIs for Vocus Wholesale customers, providing connectivity, real-time data access and automated network solutions (quote-to-delivery, provisioning, on-demand service changes), designed using the TMF / MEF Sonata industry frameworks. The API catalogue and reference on the Vocus API Portal (developer.vocus.com.au, Salesforce Experience Cloud) is visible only after login; access is granted via a Vocus Account Manager after verifying an active agreement. No public base URL or machine-readable contract is published.
